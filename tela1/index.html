<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Entre Páginas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form id="formCadastro" onsubmit="return verificarSenha(event)">

        <h1>Cadastro</h1>

        <!-- Tipo de cadastro -->
        <label for="tipo">Tipo de cadastro:</label>
        <select id="tipo" name="tipo" required>
            <option value="">Selecione</option>
            <option value="usuario">Usuário</option>
            <option value="funcionario">Funcionário</option>
        </select>

        <!-- Nome -->
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

        <!-- CPF -->
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" inputmode="numeric" pattern="[0-9]+" required>

        <!-- Data de nascimento -->
        <label for="dataNascimento">Data de nascimento:</label>
        <input type="date" id="dataNascimento" name="dataNascimento" required>
        <!-- Seção do Responsável (Aparece apenas se for menor de idade) -->
<div id="secaoResponsavel" style="display: none; background: var(--azul-gelo); padding: 20px; border-radius: 8px; margin-top: 15px; border: 1px solid var(--azul-claro);">
    <h3 style="color: var(--azul-escuro); margin-bottom: 10px; font-size: 1.1rem;">Dados do Responsável Legal</h3>

    <label for="nomeResponsavel">Nome do Responsável:</label>
    <input type="text" id="nomeResponsavel" name="nomeResponsavel" placeholder="Nome completo do responsável">

    <label for="cpfResponsavel">CPF do Responsável:</label>
    <input type="text" id="cpfResponsavel" name="cpfResponsavel" placeholder="Apenas números" inputmode="numeric" maxlength="11">

    <label for="emailResponsavel">E-mail do Responsável:</label>
    <input type="email" id="emailResponsavel" name="emailResponsavel" placeholder="E-mail para confirmação">

    <label for="celularResponsavel">Celular do Responsável:</label>
    <input type="text" id="celularResponsavel" name="celularResponsavel" placeholder="Apenas números com DDD" inputmode="numeric" maxlength="11">
</div>

        <!-- Email -->
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <!-- Celular -->
        <label for="celular">Telefone:</label>
        <input type="text" id="celular" name="celular" placeholder="Digite seu telefone" inputmode="numeric" pattern="[0-9]+" required>

        <!-- Endereço -->
        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço" required>

        <!-- Bairro -->
        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" name="bairro" placeholder="Digite seu bairro" required>

        <!-- Cidade -->
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required>

        <!-- Senha -->
        <label for="senha">Senha:</label>
        <div class="input-container">
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            <button type="button" class="btn-toggle-senha" data-target="senha">👁️</button>
        </div>

        <!-- Requisitos da Senha -->
        <ul id="requisitos-senha">
            <li id="tamanho" class="invalido">Mínimo de 8 caracteres</li>
            <li id="maiuscula" class="invalido">Pelo menos uma letra maiúscula</li>
            <li id="minuscula" class="invalido">Pelo menos uma letra minúscula</li>
            <li id="numero" class="invalido">Pelo menos um número</li>
            <li id="especial" class="invalido">Pelo menos um caractere especial (!@#$...)</li>
        </ul>

        <!-- Confirmar senha -->
        <label for="confirmarSenha">Confirmar senha:</label>
        <div class="input-container">
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novamente" required>
            <button type="button" class="btn-toggle-senha" data-target="confirmarSenha">👁️</button>
        </div>

        <!-- Mensagem de sucesso ou erro -->
        <div id="mensagem"></div>

        <!-- Botão único de submissão -->
        <button type="submit">Cadastrar</button>

    </form>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
